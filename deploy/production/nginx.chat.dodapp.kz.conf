# Install once in the http context, alongside the other virtual hosts.
map $http_upgrade $chat_backend_connection_upgrade {
    default upgrade;
    '' close;
}

log_format chat_backend_path '$remote_addr $request_method $uri $status';

server {
    listen 443 ssl;
    server_name chat.dodapp.kz;

    ssl_certificate /etc/letsencrypt/live/chat.dodapp.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.dodapp.kz/privkey.pem;

    access_log /var/log/nginx/chat-backend.access.log chat_backend_path;
    error_log /var/log/nginx/chat-backend.error.log crit;
    client_max_body_size 6m;

    location / {
        proxy_pass https://127.0.0.1:15105;
        proxy_ssl_server_name on;
        proxy_ssl_name chat-backend.internal;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/chat-backend-ca.crt;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chat_backend_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
