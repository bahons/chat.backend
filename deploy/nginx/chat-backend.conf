# Place in the http context of the TLS edge. Keep Kestrel bound to loopback.
map $http_upgrade $chat_connection_upgrade {
    default upgrade;
    '' close;
}

log_format chat_path '$remote_addr $request_method $uri $status';

server {
    listen 80;
    server_name api.example.test;
    access_log off;
    return 403;
}

server {
    listen 443 ssl;
    server_name api.example.test;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host != api.example.test) {
        return 421;
    }

    access_log /var/log/nginx/access.log chat_path;
    error_log /var/log/nginx/error.log crit;

    # B05.3 requires one Production API per database. Keep a single upstream and use stop-first rollout.
    location / {
        proxy_pass https://127.0.0.1:5105;
        proxy_ssl_server_name on;
        proxy_ssl_name chat-backend.internal;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/tls/upstream-ca.pem;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chat_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
        client_max_body_size 6m;
    }
}
