name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore chat.sln
      - run: dotnet format chat.sln --no-restore --verify-no-changes
      - run: dotnet build chat.sln --no-restore -warnaserror
      - run: dotnet test chat.sln --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: artifacts/openapi.json
          if-no-files-found: error
